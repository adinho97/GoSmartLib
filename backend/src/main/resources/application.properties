spring.datasource.url=jdbc:mysql://db:3306/gosmartlib
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# HikariCP Connection Pool Configuration for Production
# Increased for high concurrent load from frontend (multiple simultaneous API calls)
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=30000

# Connection validation
spring.datasource.connection-test-query=SELECT 1
spring.datasource.hikari.data-source-properties.useSSL=false
spring.datasource.hikari.data-source-properties.allowPublicKeyRetrieval=true
spring.datasource.hikari.data-source-properties.serverTimezone=UTC

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict

# Connection pool monitoring
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=gosmartlib

# CORS allowed origins (dev + prod)
app.cors.allowed-origins=http://localhost:4200,https://gosmartlibs07.tech

server.forward-headers-strategy=framework

smartschool.client-id=2ebf496d131b
smartschool.client-secret=${SMARTSCHOOL_CLIENT_SECRET}
smartschool.redirect-uri=https://gosmartlibs07.tech/auth/callback

# The base URL for the Smartschool API. Change this if you are having DNS issues.
smartschool.apiBaseUrl=https://oauth.smartschool.be

# OneRoster per-school config. client-secret is resolved from the env var below;
# if the env var is unset the placeholder remains and OneRosterProperties.isUsable()
# treats this school as not configured, so startup sync silently skips it.
oneroster.schools.aphogeschool.client-id=${ONEROSTER_APHOGESCHOOL_CLIENT_ID:}
oneroster.schools.aphogeschool.client-secret=${ONEROSTER_APHOGESCHOOL_CLIENT_SECRET:}
oneroster.schools.aphogeschool.school-id=5905
oneroster.schools.aphogeschool.base-url=https://aphogeschool.smartschool.be/ims/oneroster

# JWT Configuration
jwt.secret=${JWT_SECRET:your-super-secret-key-that-should-be-at-least-32-characters-long-change-in-production}
jwt.expiration=86400000

# Logging Configuration - Production Safe
logging.level.root=INFO
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.engine.transaction.internal.TransactionImpl=DEBUG
logging.level.com.zaxxer.hikari=INFO
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10
logging.file.total-size-cap=100MB
