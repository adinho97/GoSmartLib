<div class="add-book-page">
  <h1>Voeg manueel een boek toe</h1>
  <form (ngSubmit)="onSubmit(bookForm)" #bookForm="ngForm" class="book-form">
    <div class="form-row">
      <label for="titel">Titel</label>
      <input
        id="titel"
        name="titel"
        #titel="ngModel"
        [(ngModel)]="book.titel"
        required
        maxlength="255"
        [class.field-invalid]="titel.invalid && (titel.touched || isSubmitted)"
      />
      <small
        *ngIf="titel.errors?.['required'] && (titel.touched || isSubmitted)"
        class="field-error"
      >
        Titel is verplicht.
      </small>
    </div>

    <div class="form-row">
      <label for="auteur">Auteur</label>
      <input
        id="auteur"
        name="auteur"
        #auteur="ngModel"
        [(ngModel)]="book.auteur"
        required
        maxlength="255"
        [class.field-invalid]="auteur.invalid && (auteur.touched || isSubmitted)"
      />
      <small
        *ngIf="auteur.errors?.['required'] && (auteur.touched || isSubmitted)"
        class="field-error"
      >
        Auteur is verplicht.
      </small>
    </div>

    <div class="form-row">
      <label for="cover">Cover</label>
      <input
        id="cover"
        name="cover"
        #coverInput
        class="cover-file-input"
        type="file"
        accept="image/*"
        (change)="onCoverSelected($event)"
      />
      <div class="cover-upload-row">
        <label for="cover" class="cover-upload-button">Kies afbeelding</label>
        <span class="cover-file-name">
          {{ selectedCoverFile?.name || "Geen bestand geselecteerd" }}
        </span>
      </div>
      <div *ngIf="coverPreviewUrl" class="cover-preview-wrapper">
        <img
          [src]="coverPreviewUrl"
          alt="Cover preview"
          class="cover-preview"
        />
      </div>
    </div>

    <div class="form-row">
      <label for="beschrijving">Beschrijving</label>
      <textarea
        id="beschrijving"
        name="beschrijving"
        maxlength="5000"
        [(ngModel)]="book.beschrijving"
      ></textarea>
    </div>

    <div class="form-row">
      <label for="genre">Genre</label>
      <input id="genre" name="genre" [(ngModel)]="book.genre" maxlength="100" />
    </div>

    <div class="form-row">
      <label for="uitgaveDatum">Uitgave Datum</label>
      <input
        id="uitgaveDatum"
        name="uitgaveDatum"
        type="date"
        max="9999-12-31"
        [(ngModel)]="book.uitgaveDatum"
      />
    </div>

    <div class="form-row">
      <label for="paginas">Pagina's</label>
      <input
        id="paginas"
        name="paginas"
        type="number"
        min="1"
        max="100000"
        [(ngModel)]="book.paginas"
      />
    </div>

    <div class="form-row">
      <label for="taal">Taal</label>
      <select id="taal" name="taal" [(ngModel)]="book.taal">
        <option value="">Kies een taal</option>
        <option *ngFor="let taal of talen" [value]="taal">{{ taal }}</option>
      </select>
    </div>

    <div class="form-row">
      <label for="uitgeverij">Uitgeverij</label>
      <input
        id="uitgeverij"
        name="uitgeverij"
        [(ngModel)]="book.uitgeverij"
        maxlength="255"
      />
    </div>

    <button type="submit" [disabled]="isSaving || bookForm.invalid">
      {{ isSaving ? "Opslaan..." : "Opslaan" }}
    </button>

    <p
      *ngIf="submitMessage"
      [class.success-message]="submitState === 'success'"
      [class.error-message]="submitState === 'error'"
    >
      {{ submitMessage }}
    </p>
  </form>
</div>
