<div class="change-password-page">
  <div class="change-password-card">
    <h1>Wachtwoord wijzigen</h1>
    <p class="subtitle">Werk je super-admin wachtwoord veilig bij.</p>

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label for="oldPassword">Huidig wachtwoord</label>
        <input
          id="oldPassword"
          type="password"
          [(ngModel)]="oldPassword"
          name="oldPassword"
          [disabled]="isSaving"
          required
        />
      </div>

      <div class="form-group">
        <label for="newPassword">Nieuw wachtwoord</label>
        <input
          id="newPassword"
          type="password"
          [(ngModel)]="newPassword"
          name="newPassword"
          [disabled]="isSaving"
          required
        />
        <small class="password-hint">
          Min. 8 tekens, 1 hoofdletter, 1 kleine letter en 1 cijfer.
        </small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Bevestig nieuw wachtwoord</label>
        <input
          id="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          [disabled]="isSaving"
          required
        />
      </div>

      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
      <p class="success-message" *ngIf="successMessage">{{ successMessage }}</p>

      <div class="actions">
        <button type="button" class="btn-secondary" (click)="backToDashboard()">
          Terug
        </button>
        <button type="submit" class="btn-primary" [disabled]="isSaving">
          {{ isSaving ? "Opslaan..." : "Opslaan" }}
        </button>
      </div>
    </form>
  </div>
</div>
