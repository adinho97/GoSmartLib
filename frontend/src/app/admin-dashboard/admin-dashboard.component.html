<div class="admin-dashboard">
  <!-- Header -->
  <div class="dashboard-header">
    <div class="header-content">
      <h1>Beheerder Dashboard</h1>
      <p class="subtitle">Welkom in het GO!SmartLib administratief paneel</p>
    </div>
    <div class="account-dropdown" (click)="$event.stopPropagation()">
      <button
        type="button"
        class="btn-account"
        (click)="toggleAccountMenu()"
        [attr.aria-expanded]="accountMenuOpen"
      >
        Account
      </button>

      <div class="account-menu" [class.show]="accountMenuOpen">
        <button
          type="button"
          class="account-menu-item"
          (click)="goToChangePassword()"
        >
          Wachtwoord wijzigen
        </button>
        <button
          type="button"
          class="account-menu-item logout-item"
          (click)="logout()"
          [disabled]="isLoading"
        >
          {{ isLoading ? "Bezig met uitloggen..." : "Uitloggen" }}
        </button>
      </div>
    </div>
  </div>

  <!-- Welcome Section -->
  <div class="welcome-section" *ngIf="adminInfo">
    <div class="admin-info-card">
      <h2>Hallo, {{ adminInfo.username || "Beheerder" }}!</h2>
      <p>Je bent ingelogd als Super Administrator</p>
      <div class="info-details">
        <p><strong>Rol:</strong> Super Admin</p>
        <p><strong>Gebruikersnaam:</strong> {{ adminInfo.username }}</p>
      </div>
    </div>
  </div>
</div>
