<div class="super-admin-login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Super Admin Portal</h1>
      <p>Administrative Access</p>
    </div>

    <form class="login-form" (ngSubmit)="login()">
      <!-- Error Message -->
      <div *ngIf="errorMessage" class="error-message">
        <span>⚠️ {{ errorMessage }}</span>
      </div>

      <!-- Username Field -->
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          class="form-control"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter your username"
          [disabled]="isLoading"
          autocomplete="username"
          required
        />
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input-group">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            class="form-control"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your password"
            [disabled]="isLoading"
            (keypress)="onKeyPress($event)"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            [disabled]="isLoading"
            aria-label="Toggle password visibility"
          >
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <!-- Login Button -->
      <button
        type="submit"
        class="btn-login"
        [disabled]="isLoading"
      >
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading" class="loading-spinner">
          <span class="spinner"></span> Logging in...
        </span>
      </button>
    </form>

    <!-- Footer Links -->
    <div class="login-footer">
      <p>Not a super admin?</p>
      <a href="javascript:void(0)" (click)="goToUserLogin()" class="link-secondary">
        Go to user login
      </a>
    </div>

    <!-- Warning Banner -->
    <div class="warning-banner">
      <p>⚠️ This portal is for administrative use only. Keep your credentials secure.</p>
    </div>
  </div>
</div>
