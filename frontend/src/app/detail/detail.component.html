@if (book) {
  <div class="detail-wrapper">
    <div class="detail-card">
      <button class="back-btn" (click)="goBack()">← Terug</button>
      
      @if (isLibrarian) {
        <a class="edit-btn-detail" [routerLink]="['/edit', book.id]">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
          </svg>
          Aanpassen
        </a>
      }

      <h1 class="book-title">{{ book.titel }}</h1>
      <div class="detail-content">
        <div class="book-cover">
          @if (book.cover) {
            <img [src]="book.cover" alt="{{ book.titel }}">
          }
        </div>
        <div class="book-info">
          <div class="info-grid">
            <div><span>Auteur</span>{{ book.auteur }}</div>
            <div><span>Genre</span>{{ book.genre }}</div>
            <div><span>Taal</span>{{ book.taal }}</div>
            <div><span>Pagina’s</span>{{ book.paginas }}</div>
            <div><span>Uitgave</span>{{ book.uitgaveDatum | date }}</div>
            <div><span>Uitgeverij</span>{{ book.uitgeverij }}</div>
          </div>
          <div class="book-description">
            <h3>Beschrijving</h3>
            <p>{{ book.beschrijving }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
}
