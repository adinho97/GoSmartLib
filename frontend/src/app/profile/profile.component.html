<div class="profile-wrapper">

  <div class="profile-header">
    <h1>John Doe</h1>
    <div class="profile-role">{{ role }}</div>
  </div>

  <div class="profile-container">

    <section class="profile-section">
      <h3 class="section-title">Favoriete Boeken</h3>

      <div class="horizontal-scroll-wrapper">

        <div class="profile-book-card" *ngFor="let book of favoriteBooks">

          <div class="book-cover" *ngIf="book.cover">
            <img [src]="book.cover" alt="{{book.title}}">
          </div>

          <div class="cover-placeholder" *ngIf="!book.cover">
            Geen Cover
          </div>

          <div class="book-content">
            <h4>{{book.title}}</h4>
            <div class="author">{{book.author}}</div>
          </div>

        </div>

      </div>
    </section>


    <section class="profile-section">
      <h3 class="section-title">Leeshistoriek</h3>

      <div class="horizontal-scroll-wrapper">

        <div class="profile-book-card" *ngFor="let book of readingHistory">

          <div class="book-cover" *ngIf="book.cover">
            <img [src]="book.cover">
          </div>

          <div class="cover-placeholder" *ngIf="!book.cover">
            Geen Cover
          </div>

          <div class="book-content">
            <h4>{{book.title}}</h4>
            <div class="book-meta">
              Uitgelezen {{book.finishedDate | date}}
            </div>
          </div>

        </div>

      </div>
    </section>


    <section class="profile-section">
      <h3 class="section-title">Geleende Boeken</h3>

      <div class="horizontal-scroll-wrapper">

        <div class="profile-book-card" *ngFor="let book of borrowedBooks">

          <div class="book-cover">
            <img [src]="book.cover">
          </div>

          <div class="book-content">
            <h4>{{book.title}}</h4>
            <div class="deadline">
              Return before {{book.deadline | date}}
            </div>
          </div>

        </div>

      </div>
    </section>

    <section class="profile-section">
  <h3 class="section-title">Dashboard Instellingen</h3>

  <div class="dashboard-settings-card">

    <label class="setting-option">
      <input type="checkbox" [(ngModel)]="dashboardSettings.showFavorites">
      Favoriete boeken tonen op dashboard
    </label>

    <label class="setting-option">
      <input type="checkbox" [(ngModel)]="dashboardSettings.showReadingHistory">
      Leeshistoriek tonen op dashboard
    </label>

    <label class="setting-option">
      <input type="checkbox" [(ngModel)]="dashboardSettings.showBorrowed">
      Geleende boeken tonen op dashboard
    </label>

    <button class="save-btn" (click)="saveDashboardSettings()">
      Instellingen opslaan
    </button>

  </div>
</section>

  </div>
</div>
