<div class="edit-container">
  <h2>Boek aanpassen</h2>

  <div class="copy-manager">
<div class="copy-info">
  <span class="copy-count">
    {{ copySummary.available }} / {{ copySummary.total }} exemplaren beschikbaar
  </span>
</div>
    <div class="copy-actions">
      <button
        type="button"
        class="copy-btn remove"
        (click)="removeCopy()"
        [disabled]="isRemovingCopy || copySummary.total === 0"
      >
        − Verwijderen
      </button>
      <button
        type="button"
        class="copy-btn add"
        (click)="addCopy()"
        [disabled]="isAddingCopy"
      >
        + Toevoegen
      </button>
    </div>
    @if (copyMessage) {
      <p class="copy-success">{{ copyMessage }}</p>
    }
    @if (copyError) {
      <p class="copy-error">{{ copyError }}</p>
    }
  </div>

  @if (isLoading) {
    <p style="text-align: center; font-family: Arial, sans-serif;">
      Gegevens ophalen...
    </p>
  } @else {
    <form (ngSubmit)="onSubmit()">
      <div class="form-layout">
        <div class="form-group">
          <label for="titel">Titel</label>
          <input id="titel" type="text"
            [(ngModel)]="book.titel" name="titel" required>
        </div>
        <div class="form-group">
          <label for="auteur">Auteur</label>
          <input id="auteur" type="text"
            [(ngModel)]="book.auteur" name="auteur" required>
        </div>
        <div class="form-group">
          <label for="genre">Genre</label>
          <input id="genre" type="text"
            [(ngModel)]="book.genre" name="genre">
        </div>
        <div class="form-group">
          <label for="taal">Taal</label>
          <input id="taal" type="text"
            [(ngModel)]="book.taal" name="taal">
        </div>
        <div class="form-group full-width">
          <label for="beschrijving">Beschrijving</label>
          <textarea id="beschrijving"
            [(ngModel)]="book.beschrijving" name="beschrijving"></textarea>
        </div>
        <div class="button-group">
          <button type="submit" class="save-button">Opslaan</button>
          <button type="button" class="cancel-button" (click)="cancel()">
            Annuleren
          </button>
        </div>
      </div>
    </form>
  }

  @if (errorMessage) {
    <p class="error">{{ errorMessage }}</p>
  }
</div>
