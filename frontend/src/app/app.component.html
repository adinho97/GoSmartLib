@if (showNavbar) {
  <header class="top-nav">
    <nav class="top-nav-inner" aria-label="Hoofdnavigatie">
      <a class="brand" [routerLink]="['/dashboard']">GoSmartLib</a>
      <div class="nav-links">
        <a routerLink="/profile" routerLinkActive="active">Profiel</a>
        <a routerLink="/books" [class.active]="isBooksListActive"
          >Boekenlijst</a
        >
        @if (isLibrarian) {
          <div class="nav-dropdown" tabindex="0">
            <button type="button" class="nav-dropdown-trigger">Add book</button>
            <div class="nav-dropdown-menu">
              <a routerLink="/isbn" routerLinkActive="active">ISBN</a>
              <a routerLink="/add" routerLinkActive="active">Manueel</a>
            </div>
          </div>
        }
        @if (isTeacher) {
          <a
            routerLink="/books"
            [queryParams]="{ genre: 'Didactiek' }"
            [class.active]="isDidacticCollectionActive"
          >
            Didactische collectie
          </a>
        }
      </div>
    </nav>
  </header>
}

<main class="app-shell" [class.with-nav]="showNavbar">
  <router-outlet></router-outlet>
</main>
