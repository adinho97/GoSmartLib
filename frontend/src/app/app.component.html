@if (showNavbar) {
  <header class="top-nav">
    <nav class="top-nav-inner" aria-label="Hoofdnavigatie">
      <div class="nav-left">
        <a class="brand" [routerLink]="['/dashboard']">GO!SmartLib</a>
      </div>
      <div class="nav-links">
        <a
          routerLink="/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Dashboard
        </a>
        <a routerLink="/books" [class.active]="isBooksListActive">
          Boekencatalogus
        </a>
        @if (isLibrarian) {
          <a routerLink="/add-general" routerLinkActive="active">
            Boek toevoegen
          </a>
        }
        @if (isTeacher) {
          <a
            class="teacher-badge-link"
            routerLink="/books"
            [queryParams]="{ genre: 'Didactiek' }"
            [class.active]="isDidacticCollectionActive"
          >
            Didactische collectie
          </a>
        }
        @if (canAccessLoans) {
          <a routerLink="/uitleen" routerLinkActive="active">Boek uitlenen</a>
        }
        <div class="profile-menu" (click)="$event.stopPropagation()">
          <button
            type="button"
            class="profile-link"
            aria-label="Profielmenu"
            title="Profielmenu"
            [class.active]="profileMenuOpen"
            (click)="toggleProfileMenu($event)"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 21a8 8 0 0 0-16 0"></path>
              <circle cx="12" cy="8" r="4"></circle>
            </svg>
          </button>

          @if (profileMenuOpen) {
            <div class="profile-dropdown" role="menu" aria-label="Profielmenu">
              <p class="profile-name">{{ userName }}</p>
              <p class="profile-role-text">{{ userRoleLabel }}</p>
              <button
                type="button"
                class="profile-logout-btn"
                (click)="logout()"
              >
                Uitloggen
              </button>
            </div>
          }
        </div>
      </div>
    </nav>
  </header>
}

<main class="app-shell" [class.with-nav]="showNavbar">
  <router-outlet></router-outlet>
</main>
