<!-- In je header sectie -->
<div class="header-actions">
  @if (isLibrarian) {
    <button
      class="notification-bell"
      routerLink="/mijn-taken/review-beheer"
      title="Review meldingen"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      @if (pendingReportsCount > 0) {
        <span class="bell-badge">{{ pendingReportsCount }}</span>
      }
    </button>
  }
  <!-- Profiel menu etc -->
</div>
