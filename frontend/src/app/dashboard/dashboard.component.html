<div class="home-wrapper">
  <header class="hero">
    <h1>GoSmartLib</h1>
    <p>Ontdek de meest populaire boeken van dit moment.</p>
  </header>

  <main class="container">
    <h2 class="section-title">Populaire Collectie</h2>
    
    <div class="horizontal-scroll-wrapper" *ngIf="!loading">
      <div class="book-card" *ngFor="let book of featuredBooks">
        
        <div class="genre-tag">{{ book.genre }}</div>

        <div class="book-cover">
          <img *ngIf="book.coverUrl" [src]="book.coverUrl" [alt]="book.titel">
          <div *ngIf="!book.coverUrl" style="width:100%; height:100%; background:#eee; border-left:3px solid #8B0000;"></div>
        </div>

        <div class="book-content">
          <h4>{{ book.titel }}</h4>
          <p class="author">{{ book.auteur }}</p>
          
          <div class="book-meta">
            <span>{{ book.taal }}</span>
            <span> • {{ book.paginas }} pag.</span>
          </div>

          <p class="desc">{{ book.beschrijving }}</p>
          <button class="details-btn">Details</button>
        </div>
      </div>
    </div>
  </main>
</div>
