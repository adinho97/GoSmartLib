<header class="section-header">
  <h2 class="section-title">Mijn huidige uitleningen</h2>
  <span class="count-tag">{{ loans.length }} boeken</span>
</header>

<div class="loans-container">
  @for (loan of loans; track loan.id) {
    <div class="loan-card" (click)="goToDetail(loan.bookId)">
      <div class="card-content">
        <div class="cover-wrapper">
          <img [src]="loan.bookCover" [alt]="loan.bookTitel" class="mini-cover" />
        </div>

        <div class="book-details">
          <span class="genre-label">Lening</span>
          <h4 class="title">{{ loan.bookTitel }}</h4>
          
          <p class="due-date" [class.overdue]="isOverdue(loan.dueDate)">
            {{ isOverdue(loan.dueDate) ? 'TE LAAT' : 'Inleveren: ' + (loan.dueDate | date: 'dd/MM') }}
          </p>
          
          <button class="btn-details">Details</button>
        </div>
      </div>
    </div>
  }
</div>
