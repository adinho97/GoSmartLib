<div class="book-card" [title]="book.reason">
  <!-- Wishlist button -->
  <button
    type="button"
    class="wishlist-toggle-btn"
    [class.active]="isWishlisted"
    [attr.aria-label]="
      isWishlisted
        ? 'Verwijder uit verlanglijst'
        : 'Voeg toe aan verlanglijst'
    "
    (click)="onToggleWishlist($event)"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path
        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
      />
    </svg>
  </button>

  <!-- Favorite button -->
  <button
    type="button"
    class="favorite-toggle-btn"
    [class.active]="isFavorited"
    [attr.aria-label]="
      isFavorited ? 'Verwijder uit favorieten' : 'Voeg toe aan favorieten'
    "
    (click)="onToggleFavorite($event)"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <polygon
        points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"
      />
    </svg>
  </button>

  <!-- Score badge -->
  <div class="score-badge">{{ book.score | number: '1.0-0' }}%</div>

  <!-- Genre tag -->
  <div class="genre-tag">{{ book.genre }}</div>

  <!-- Book cover -->
  <div class="book-cover">
    <div class="cover-placeholder">
      <span>COVER</span>
    </div>
  </div>

  <!-- Book info -->
  <div class="book-content">
    <h4>{{ book.titel }}</h4>
    <p class="author">door {{ book.auteur }}</p>
    <p class="reason-text">{{ book.reason }}</p>
    <button class="details-btn" (click)="onViewDetails()">
      Details
    </button>
  </div>
</div>
